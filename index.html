<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You are special!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050505;color:#fff;font-family:'Quicksand',system-ui,sans-serif;overflow:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#hearts i{position:absolute;bottom:-30px;color:#ff4fa8;opacity:.0;animation:up linear forwards}
@keyframes up{10%{opacity:.35}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom));padding-top:calc(24px + env(safe-area-inset-top));text-align:center;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;overflow-y:auto}
.s.on{opacity:1;visibility:visible}
.script{font-family:'Dancing Script',cursive;font-weight:700}
.ring{width:132px;height:132px;border-radius:50%;background:#2a0615;border:2px solid #7a1c4a;box-shadow:0 0 28px rgba(255,64,160,.35);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.ring svg,.ring img{width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-size:46px;color:#ff5fae;margin:22px 0 6px;text-shadow:0 0 18px rgba(255,80,170,.45)}
p.sub{font-size:15px;color:#cfc0c9;margin-bottom:26px}
.btn{border:0;background:linear-gradient(90deg,#ff2e93,#ff4fb8);color:#fff;font:600 16px 'Quicksand',sans-serif;padding:14px 30px;border-radius:30px;box-shadow:0 0 22px rgba(255,46,147,.55);cursor:pointer;animation:beat 1.6s infinite}
@keyframes beat{50%{transform:scale(1.05)}}
.card{width:100%;max-width:330px;background:#12050c;border:1px solid #3a0f26;border-radius:16px;padding:22px 20px}
.card .t{font-weight:600;font-size:15px}
.pct{font-size:34px;font-weight:700;color:#ff4fb8;margin:8px 0 12px}
.bar{height:9px;background:#2a0f1c;border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2e93,#ff6ec4);box-shadow:0 0 12px #ff2e93}
.calc{margin-top:16px;font-size:13px;color:#ff4fb8;font-weight:600}
.warn{display:none;margin-top:16px;font-size:12px;color:#ff4fb8;letter-spacing:.5px;font-weight:600;animation:shake .35s 3}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.big{width:96px;height:96px;font-size:46px;color:#ff4fc3}
.big{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#2a0615;border:2px solid #7a1c4a;box-shadow:0 0 26px rgba(255,64,160,.4);animation:beat 1.8s infinite}
h2{font-size:34px;margin:22px 0 4px;color:#fff}
.tap{font-size:13px;color:#b8a9b2;margin-bottom:22px}
.rows{width:100%;max-width:330px;display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.row{height:46px;border-radius:10px;background:#16090f;border:1px solid #2c1320;color:#fff;font:500 14px 'Quicksand',sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .4s}
.row.open{background:#1c1c1c;border-color:#333}
.row .h{color:#ff6ec4;font-size:18px}
.row span{animation:fi .6s}
@keyframes fi{from{opacity:0;transform:scale(.9)}}
.more{display:none}
.gift{width:100%;max-width:310px;margin-top:20px;border-radius:10px;overflow:hidden;background:#ffd6ec;cursor:pointer;box-shadow:0 0 30px rgba(255,100,190,.35);animation:beat 2s infinite}
.gift .top{height:44px;background:linear-gradient(#ff9bd0,#ffb3dc);display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#ff2e93;font-size:20px}
.gift .bd{padding:18px 0 14px;background:#ffe3f1;color:#ff6ec4;font-size:13px;font-weight:600}
.gift .bd div{font-size:62px;line-height:1.1;color:#e8197f}
.paper{display:none;width:100%;max-width:330px;margin-top:20px;background:linear-gradient(160deg,#ffdff0,#ffb5d8);border-radius:10px;padding:22px 20px;color:#6b3a52;text-align:left;font-size:15px;line-height:1.7;box-shadow:0 0 34px rgba(255,100,190,.35)}
.paper .hh{text-align:center;color:#ff2e93;font-size:32px;margin-bottom:10px}
#txt{white-space:pre-wrap;min-height:210px}
.cur::after{content:'|';animation:bl .8s infinite}
@keyframes bl{50%{opacity:0}}
.paper .btn{display:none;margin:16px auto 0}
.fin{font-size:30px;margin-top:26px;color:#fff;max-width:300px;animation:fi 1.4s .4s both}
.nm{font-size:58px;line-height:1.1;color:#ff5fae;margin-top:6px;text-shadow:0 0 20px rgba(255,80,170,.55);animation:fi 1.4s 1.2s both}
.fin{font-size:28px!important;margin-top:20px!important}
#rs{margin-top:22px;background:transparent;border:1.5px solid #ff4fb8;box-shadow:none;animation:fi 1s 3s both}
.ring.p{width:min(80vw,310px);height:min(80vw,310px);border-color:#ff6ec4;box-shadow:0 0 40px rgba(255,64,160,.5)}
.photo{width:min(94vw,520px);flex:none;border-radius:22px;overflow:hidden;border:2px solid #ff6ec4;box-shadow:0 0 44px rgba(255,64,160,.55);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.photo img{display:block;width:100%;height:auto}
#s5{justify-content:flex-start;padding-top:calc(18px + env(safe-area-inset-top))}
#s5 .fin{font-size:26px!important;margin-top:16px!important}
#s5 .nm{font-size:96px;margin-top:2px}
#s5 #rs{margin-bottom:12px}
#mu{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:9;background:rgba(255,255,255,.08);border:0;color:#ff8ac9;width:38px;height:38px;border-radius:50%;font-size:17px;display:none}
</style></head><body>
<div id="hearts"></div>
<button id="mu" aria-label="Music on or off">♪</button>

<script>
const $=id=>document.getElementById(id),au=$('au');
const START=0;
function useEmbedded(){try{const b=atob($('sd').textContent.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);au.src=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}));au.load()}catch(e){}}
useEmbedded();au.volume=1;
au.addEventListener('loadedmetadata',()=>{if(START&&au.currentTime<START)au.currentTime=START},{once:true});
function playSong(){if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{})}}
let started=false,muted=false;
['touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>{if(started&&!muted)playSong()},{passive:true}));
function go(n){document.querySelectorAll('.s').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on')}
function heart(){const h=document.createElement('i');h.textContent='♥';h.style.left=Math.random()*100+'%';h.style.fontSize=(10+Math.random()*18)+'px';h.style.animationDuration=(6+Math.random()*6)+'s';$('hearts').appendChild(h);setTimeout(()=>h.remove(),12500)}
setInterval(heart,700);
$('mu').onclick=e=>{e.stopPropagation();if(muted){muted=false;playSong();$('mu').style.opacity=1}else{muted=true;au.pause();$('mu').style.opacity=.4}};
$('b1').onclick=()=>{started=true;playSong();$('mu').style.display='block';go(2);measure()};
function measure(){let v=0;const pc=$('pc'),pb=$('pb');
 const t=setInterval(()=>{v+=v<100?2:1;pc.textContent=v+'%';pb.style.width=Math.min(v,100)+'%';
  if(v==101)$('cl').textContent='Calculating cuteness...';
  if(v>=120){clearInterval(t);$('mt').style.opacity=.4;pc.style.opacity=.5;$('cl').style.display='none';$('wn').style.display='block';setTimeout(()=>{go(3);build()},2200)}},45)}
const L=['You look adorable','You have the sweetest vibe','You make things feel lighter','You make everything feel warm','You\'re my favorite person'];let opened=0;
function build(){const r=$('rows');if(r.children.length)return;L.forEach(t=>{const d=document.createElement('div');d.className='row';d.innerHTML='<span class="h">♡</span>';d.onclick=()=>{if(d.classList.contains('open'))return;d.classList.add('open');d.innerHTML='<span>'+t+'</span>';if(++opened==L.length)setTimeout(()=>$('b3').style.display='inline-block',500)};r.appendChild(d)})}
$('b3').onclick=()=>go(4);
const N="I just wanted to tell you something... you really are special in a way that's hard to explain.\nThere's a softness in the way you talk, a sweetness in the way you smile, and something genuine about you that just feels good to be around.\nYou don't try to be anything extra, you're just you, and that's what makes you so lovely.";
$('gift').onclick=()=>{$('gift').style.display='none';$('paper').style.display='block';const e=$('txt');e.classList.add('cur');let i=0;
 const t=setInterval(()=>{e.textContent=N.slice(0,++i);if(i>=N.length){clearInterval(t);e.classList.remove('cur');$('b4').style.display='block'}},38)};
$('b4').onclick=()=>go(5);
$('rs').onclick=()=>{opened=0;$('rows').innerHTML='';$('b3').style.display='none';$('gift').style.display='';$('paper').style.display='none';$('txt').textContent='';$('b4').style.display='none';
 $('pc').textContent='0%';$('pc').style.opacity=1;$('pb').style.width='0';$('mt').style.opacity=1;$('cl').style.display='';$('cl').textContent='Calculating cuteness...';$('wn').style.display='none';go(1)};
</script></body></html>
